name: Build HyDr0 Store APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Name shown under the app icon"
        default: "HyDr0 Store"
        required: true
      catalog_url:
        description: "Catalog link baked into the app (leave empty for this repo's catalog)"
        default: ""
        required: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"

concurrency:
  group: store-build
  cancel-in-progress: false

permissions:
  contents: write   # needed to publish releases and update catalog.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_KEYSTORE_PASS: ${{ secrets.STORE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing key missing. Add KEYSTORE_B64 and STORE_KEYSTORE_PASS secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/store.jks"
          echo "STORE_KEYSTORE_PATH=$RUNNER_TEMP/store.jks" >> "$GITHUB_ENV"
          ALIAS=$(echo -n "$KEY_ALIAS" | tr -d '[:space:]')
          if ! keytool -list -keystore "$RUNNER_TEMP/store.jks" -storepass "$STORE_KEYSTORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/store.jks" -storepass "$STORE_KEYSTORE_PASS" | grep -m1 PrivateKeyEntry | cut -d, -f1)
            echo "::warning::KEY_ALIAS didn't match the keystore; using alias found in keystore instead."
          fi
          echo "STORE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          STORE_KEYSTORE_PASS: ${{ secrets.STORE_KEYSTORE_PASS }}
          STORE_KEY_PASS: ${{ secrets.STORE_KEYSTORE_PASS }}
          APP_NAME: ${{ github.event.inputs.app_name || 'HyDr0 Store' }}
          CATALOG_URL: ${{ github.event.inputs.catalog_url }}
        run: |
          if [ -z "$CATALOG_URL" ]; then
            CATALOG_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/catalog/catalog.json"
          fi
          gradle :app:assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PappName="$APP_NAME" \
            -PcatalogUrl="$CATALOG_URL"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HyDr0-Store.apk
          sha256sum out/HyDr0-Store.apk | cut -d' ' -f1 > out/sha256.txt
          echo "SHA-256: $(cat out/sha256.txt)"
          ls -lh out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          # Numbered release, kept for history (replaced if this run is re-run)
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" out/HyDr0-Store.apk \
            --title "HyDr0 Store $VERSION" \
            --notes "SHA-256: $(cat out/sha256.txt)"
          # Fixed release that always holds the newest build (for Downloader / short links)
          gh release delete Store-latest --yes --cleanup-tag || true
          gh release create Store-latest out/HyDr0-Store.apk \
            --title "HyDr0 Store (latest)" \
            --notes "Always the newest build. Currently $VERSION. SHA-256: $(cat out/sha256.txt)"

      - name: Tell installed stores about the update
        run: |
          python3 - <<'PY'
          import json

          path = "catalog/catalog.json"
          with open(path) as f:
              data = json.load(f)

          with open("out/sha256.txt") as f:
              sha = f.read().strip()

          repo = "${{ github.repository }}"
          data["store_update"] = {
              "version_code": ${{ github.run_number }},
              "apk": "https://github.com/" + repo + "/releases/download/Store-latest/HyDr0-Store.apk",
              "sha256": sha
          }

          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "Catalog: store build ${{ github.run_number }}" || echo "Nothing to commit"
          git pull --rebase
          git push
